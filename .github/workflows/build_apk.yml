name: Build Anant Abhyas APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. स्टूडेंट Kiosk ऐप का शुद्ध ढाँचा तैयार करना और APK बनाना
      - name: Build Student App APK
        run: |
          # मौजूदा कोड को सुरक्षित रखना
          mkdir -p /tmp/student_src
          cp -r anant_student_app/* /tmp/student_src/ || true
          rm -rf anant_student_app

          # पूर्ण Android ढाँचे के साथ नया प्रोजेक्ट बनाना
          flutter create anant_student_app --project-name anant_student_app --platforms=android

          # आपकी main.dart और pubspec.yaml को वापस डालना
          cp -rf /tmp/student_src/* anant_student_app/
          
          cd anant_student_app
          flutter pub get
          flutter build apk --release

      # 2. एडमिन टेलीमेट्री ऐप का शुद्ध ढाँचा तैयार करना और APK बनाना
      - name: Build Admin App APK
        run: |
          mkdir -p /tmp/admin_src
          cp -r anant_admin_app/* /tmp/admin_src/ || true
          rm -rf anant_admin_app

          flutter create anant_admin_app --project-name anant_admin_app --platforms=android

          cp -rf /tmp/admin_src/* anant_admin_app/

          cd anant_admin_app
          flutter pub get
          flutter build apk --release

      # 3. APK फ़ाइलें डाउनलोड के लिए अपलोड करना
      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: Anant-Student-Kiosk-App
          path: anant_student_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Anant-Admin-Dashboard-App
          path: anant_admin_app/build/app/outputs/flutter-apk/app-release.apk
