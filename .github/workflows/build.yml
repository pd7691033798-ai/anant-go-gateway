name: Build Anant Abhyas Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK & Build Tools
      uses: android-actions/setup-android@v3

    - name: Auto-Generate Gradle Wrapper & Build APK
      run: |
        # Gradle इंस्टॉल और प्रोजेक्ट इनिशियलाइज़
        sudo apt-get update && sudo apt-get install -y gradle
        cd android-app
        
        # अगर build.gradle नहीं है तो ऑटो-क्रिएट करें
        cat << 'EOF' > settings.gradle
        rootProject.name = "AnantAbhyasAdmin"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.anantabhyas.admin'
            compileSdk 34

            defaultConfig {
                applicationId "com.anantabhyas.admin"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        }
        EOF

        # Wrapper जनरेट करें और APK बिल्ड करें
        gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Anant-Abhyas-Admin-APK
        path: android-app/app/build/outputs/apk/debug/*.apk
