name: Build Anant Abhyas Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Scaffold Complete Android Project
      run: |
        # 1. Licenses ऑटो-स्वीकार करें
        yes | sdkmanager --licenses || true

        # 2. आवश्यक डायरेक्टरी बनाएं
        mkdir -p android-app/app/src/main/res/values
        mkdir -p android-app/app/src/main/res/drawable

        # 3. settings.gradle
        cat << 'EOF' > android-app/settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AnantAbhyasAdmin"
        include ':app'
        EOF

        # 4. Root build.gradle
        cat << 'EOF' > android-app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
            }
        }
        EOF

        # 5. App build.gradle
        cat << 'EOF' > android-app/app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'org.jetbrains.kotlin.android'

        android {
            namespace 'com.anantabhyas.admin'
            compileSdk 34

            defaultConfig {
                applicationId "com.anantabhyas.admin"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'com.squareup.okhttp3:okhttp:4.11.0'
        }
        EOF

        # 6. Default Fallback Vector/Drawable
        cat << 'EOF' > android-app/app/src/main/res/drawable/anant_logo.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#38BDF8"
                android:pathData="M54,10 L94,90 L14,90 Z" />
        </vector>
        EOF

        # 7. Resources Values
        cat << 'EOF' > android-app/app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">अनंत अभ्यास एडमिन</string>
        </resources>
        EOF

        cat << 'EOF' > android-app/app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar"/>
        </resources>
        EOF

    - name: Download & Run Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
        unzip -q gradle-8.1.1-bin.zip
        export PATH=$PWD/gradle-8.1.1/bin:$PATH
        cd android-app
        gradle assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Anant-Abhyas-Admin-APK
        path: android-app/app/build/outputs/apk/debug/*.apk
