name: Build Anant Abhyas Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant Execute Permission for Gradlew
      run: |
        if [ -f gradlew ]; then chmod +x gradlew; fi
        if [ -f android-app/gradlew ]; then chmod +x android-app/gradlew; fi

    - name: Build Debug APK
      run: |
        if [ -f gradlew ]; then ./gradlew assembleDebug; elif [ -f android-app/gradlew ]; then cd android-app && ./gradlew assembleDebug; else echo "Ready"; fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anant-Abhyas-Admin-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
          
