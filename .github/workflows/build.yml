name: Build Anant Abhyas Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Scaffold & Build Project
      run: |
        # 1. Project directory setup
        mkdir -p android-app/app/src/main/res/values

        # 2. settings.gradle
        cat << 'EOF' > android-app/settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AnantAbhyasAdmin"
        include ':app'
        EOF

        # 3. Root build.gradle
        cat << 'EOF' > android-app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 4. App build.gradle
        cat << 'EOF' > android-app/app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.anantabhyas.admin'
            compileSdk 34

            defaultConfig {
                applicationId "com.anantabhyas.admin"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        }
        EOF

        # 5. Resources XML
        cat << 'EOF' > android-app/app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">अनंत अभ्यास एडमिन</string>
        </resources>
        EOF

        cat << 'EOF' > android-app/app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar"/>
        </resources>
        EOF

    - name: Run Gradle Build
      uses: gradle/gradle-build-action@v3
      with:
        build-root-directory: android-app
        arguments: assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Anant-Abhyas-Admin-APK
        path: android-app/app/build/outputs/apk/debug/*.apk
        
